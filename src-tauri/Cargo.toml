[package]
name = "cx-control-center"
version = "0.1.0"
description = "Local control center for long-running Codex sessions and account failover"
authors = ["CX Control Center contributors"]
edition = "2021"

[lib]
name = "cx_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
